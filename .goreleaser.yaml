version: 2

before:
    hooks:
        - go mod tidy
builds:
    -   binary: unique
        env:
            - CGO_ENABLED=0
        goos:
            - linux
            - darwin
snapshot:
    version_template: "{{ incpatch .Version }}-next"
changelog:
    sort: asc
    filters:
        exclude:
            - '^docs:'
            - '^test:'

homebrew_casks:
    -   name: unique
        binaries:
            - unique
        description: "Outputs the unique lines of its input"
        homepage: "https://github.com/ro-tex/unique"
        directory: Casks
        skip_upload: auto
        # GoReleaser can only write the deprecated `postflight` stanza, so add
        # `postflight_steps` by hand. It lands at the top of the cask, which
        # `brew style` flags as Cask/StanzaOrder. Switch to
        # `hooks.post.install_steps` once goreleaser/goreleaser#6873 ships.
        custom_block: |
            postflight_steps do
              on_macos do
                # The binary is not signed, so remove the quarantine attribute
                # to keep macOS Gatekeeper from blocking it.
                run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path}}/unique"]
              end
            end
        url:
            template: "https://github.com/ro-tex/unique/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
        commit_author:
            name: goreleaserbot
            email: bot@goreleaser.com
        commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
        repository:
            owner: ro-tex
            name: homebrew-tap
            branch: main
            git:
                url: 'git@github.com:ro-tex/homebrew-tap.git'
                private_key: '{{ envOrDefault "HOMEBREW_TAP_SSH_KEY" "" }}'
                ssh_command: 'ssh -i {{ .KeyPath }} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
